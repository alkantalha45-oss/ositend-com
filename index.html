<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ositend — Ajans raporlamasını otomatikleştirin</title>
    <meta
      name="description"
      content="Google Ads, Meta Ads ve GA4 verinizi her ay elle toplamayı bırakın. Ositend hesaplarınızı bir kez bağlar; markalı PDF raporu ve canlı müşteri linkini otomatik üretir."
    />
    <link rel="canonical" href="https://ositend.com/" />

    <!--
      SOSYAL PAYLAŞIM VE ARAMA ETİKETLERİ.

      Bunlar VARSAYILAN değerler. Rota değiştikçe src/lib/seo.ts içindeki
      useSeo hook'u başlık/açıklama/canonical alanlarını günceller.

      Neden burada da duruyorlar: LinkedIn, WhatsApp ve X gibi kart
      üreticileri JavaScript ÇALIŞTIRMAZ. Yalnızca hook'a bırakılsaydı
      paylaşılan her bağlantı başlıksız, açıklamasız ve görselsiz bir kart
      olarak görünürdü. Bu etiketlerle en azından ana sayfa kartı doğru
      çıkıyor; rota başına doğru kart için prerender gerekiyor.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ositend" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:url" content="https://ositend.com/" />
    <meta property="og:title" content="Ositend — Ajanslar için otomatik müşteri raporlaması" />
    <meta
      property="og:description"
      content="Google Ads, Meta Ads ve GA4 hesaplarınızı bir kez bağlayın. Markalı PDF raporu ve canlı müşteri linki her ay kendiliğinden üretilsin."
    />
    <meta property="og:image" content="https://ositend.com/shots/panel-dashboard.png" />
    <meta property="og:image:width" content="2880" />
    <meta property="og:image:height" content="1800" />
    <meta
      property="og:image:alt"
      content="Ositend panelinde ajans portföyünün özet ekranı"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ositend — Ajanslar için otomatik müşteri raporlaması" />
    <meta
      name="twitter:description"
      content="Google Ads, Meta Ads ve GA4 hesaplarınızı bir kez bağlayın. Markalı PDF raporu ve canlı müşteri linki her ay kendiliğinden üretilsin."
    />
    <meta name="twitter:image" content="https://ositend.com/shots/panel-dashboard.png" />

    <!--
      JSON-LD. Kasıtlı olarak SADE: aggregateRating, reviewCount gibi
      alanlar YOK. Henüz gerçek bir müşteri değerlendirmemiz olmadığı için
      bunları yazmak, siteden temizlediğimiz uydurma sosyal kanıtın yapısal
      veri hâli olurdu — üstelik Google'ın yapısal veri politikalarını da
      ihlal ederdi.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://ositend.com/#organization",
            "name": "Ositend",
            "url": "https://ositend.com/",
            "logo": "https://ositend.com/favicon.svg",
            "email": "info@ositend.com",
            "telephone": "+90-552-250-05-45",
            "areaServed": "TR",
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "sales",
              "email": "info@ositend.com",
              "telephone": "+90-552-250-05-45",
              "availableLanguage": ["Turkish"]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://ositend.com/#website",
            "url": "https://ositend.com/",
            "name": "Ositend",
            "inLanguage": "tr-TR",
            "publisher": { "@id": "https://ositend.com/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Ositend",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "url": "https://ositend.com/",
            "publisher": { "@id": "https://ositend.com/#organization" },
            "description": "Dijital pazarlama ajansları için otomatik müşteri raporlaması. Google Ads, Meta Ads ve GA4 verisini markalı PDF raporuna ve canlı müşteri portalına dönüştürür.",
            "offers": {
              "@type": "Offer",
              "priceCurrency": "TRY",
              "price": "4900",
              "description": "Kurucu pilot: aylık platform aboneliği (KDV hariç), ayrıca 9.900 TL tek seferlik kurulum.",
              "availability": "https://schema.org/LimitedAvailability"
            }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      TİPOGRAFİ — Schibsted Grotesk (başlık) + Instrument Sans (gövde).

      Önceki ikili Geologica + DM Sans idi. DM Sans nötr-geometrik bir
      gövde yüzü: teknik olarak kusursuz ama karaktersiz, okurken Roboto
      hissi veriyor. Bir pazarlama sitesinde gövde metni sayfanın %80'i;
      oradaki karaktersizlik bütün sayfaya siniyor.

      Schibsted Grotesk büyük puntoda özgüvenli ve editoryal duruyor —
      rakibin (Addingo) tercih ettiği Urbanist'in "arkadaş canlısı
      geometrik" tonundan bilinçli olarak ayrışıyor; bizim satmak
      istediğimiz şey sıcaklık değil, güvenilirlik.

      İkisi de değişken font ve Latin Extended kapsıyor: ı/İ/ğ/ş/ç/ö/ü
      gerçek glif olarak var, tarayıcı yapay olarak türetmiyor.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />

    <!--
      Google Analytics 4 — mülk 551168658 (ositend.com).
      Panelin GA4 sürücüsü bu mülkten okuyor; etiket olmadan mülk boş kalıyordu.

      REKLAM DEPOLAMA KAPALI: Bize yalnızca trafik/oturum verisi lazım; yeniden
      pazarlama veya kişiselleştirilmiş reklam yapmıyoruz. İhtiyacımız olmayan
      veriyi toplamamak hem KVKK/GDPR yükünü azaltıyor hem de zaten doğru olan.
      Bu üç alan izinden BAĞIMSIZ olarak kapalı kalır; ziyaretçi kabul etse bile.

      analytics_storage varsayılan olarak KAPALI: AB ziyaretçileri için analytics
      çerezi de izne tabi. Karar CookieConsent.tsx'teki banttan geliyor; gtag
      wait_for_update ile bekletiliyor, böylece izin gelmeden çerez yazılmıyor.
      Önceki ziyarette karar verilmişse aşağıda hemen uygulanıyor — dönen
      ziyaretçiye bant tekrar gösterilmiyor.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
        wait_for_update: 500,
      });

      try {
        // Gizli sekmede localStorage erişimi istisna atabilir; izin yok sayılır.
        if ((localStorage.getItem("ositend-cerez-izni") || "").indexOf("kabul") === 0) {
          gtag("consent", "update", { analytics_storage: "granted" });
        }
      } catch (e) {}
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DR52TZ1BXH"></script>
    <script>
      gtag("js", new Date());
      gtag("config", "G-DR52TZ1BXH");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
