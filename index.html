<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ositend — Ajans raporlamasını otomatikleştirin</title>
    <meta
      name="description"
      content="Google Ads, Meta Ads ve GA4 verinizi her ay elle toplamayı bırakın. Ositend hesaplarınızı bir kez bağlar; markalı PDF raporu ve canlı müşteri linkini otomatik üretir."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />

    <!--
      Google Analytics 4 — mülk 551168658 (ositend.com).
      Panelin GA4 sürücüsü bu mülkten okuyor; etiket olmadan mülk boş kalıyordu.

      REKLAM DEPOLAMA KAPALI: Bize yalnızca trafik/oturum verisi lazım; yeniden
      pazarlama veya kişiselleştirilmiş reklam yapmıyoruz. İhtiyacımız olmayan
      veriyi toplamamak hem KVKK/GDPR yükünü azaltıyor hem de zaten doğru olan.
      Bu üç alan izinden BAĞIMSIZ olarak kapalı kalır; ziyaretçi kabul etse bile.

      analytics_storage varsayılan olarak KAPALI: AB ziyaretçileri için analytics
      çerezi de izne tabi. Karar CookieConsent.tsx'teki banttan geliyor; gtag
      wait_for_update ile bekletiliyor, böylece izin gelmeden çerez yazılmıyor.
      Önceki ziyarette karar verilmişse aşağıda hemen uygulanıyor — dönen
      ziyaretçiye bant tekrar gösterilmiyor.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
        wait_for_update: 500,
      });

      try {
        // Gizli sekmede localStorage erişimi istisna atabilir; izin yok sayılır.
        if ((localStorage.getItem("ositend-cerez-izni") || "").indexOf("kabul") === 0) {
          gtag("consent", "update", { analytics_storage: "granted" });
        }
      } catch (e) {}
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DR52TZ1BXH"></script>
    <script>
      gtag("js", new Date());
      gtag("config", "G-DR52TZ1BXH");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
